name: Nightly iOS Build (Simulator)

# No Apple Developer account is configured yet, so this builds and smoke-tests
# the app for the iOS Simulator only — it cannot produce something installable
# on a physical iPhone (that requires a signing certificate + provisioning
# profile, which don't exist here). This is still a real, valuable gate: it's
# the only thing in CI that actually compiles mobile/ios (Podfile, the
# ContactsModule/PhotosModule native modules, nodejs-mobile's build phases)
# and confirms the built .app installs and launches in a simulator without
# crashing on startup.

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits since last nightly
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger; building regardless of tag state."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse refs/tags/nightly-ios 2>/dev/null || git ls-remote origin refs/tags/nightly-ios | cut -f1)
          if [ "$HEAD_SHA" = "$TAG_SHA" ]; then
            echo "No new commits since last nightly iOS build ($HEAD_SHA); skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected ($TAG_SHA -> $HEAD_SHA); building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for iOS signing secrets
        id: signing-secrets
        run: |
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ] && [ -n "${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}" ] && [ -n "${{ secrets.IOS_APPSTORE_PROVISION_PROFILE_BASE64 }}" ] && [ -n "${{ secrets.APPSTORE_API_KEY_ID }}" ] && [ -n "${{ secrets.APPSTORE_API_ISSUER_ID }}" ] && [ -n "${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: |
          mkdir -p nodejs-assets
          npm ci

      - name: Write hub-config.yaml from secrets
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          CAL_CLIENT_ID: ${{ secrets.CAL_CLIENT_ID }}
          CAL_CLIENT_SECRET: ${{ secrets.CAL_CLIENT_SECRET }}
        run: |
          cat > hub-config.yaml <<EOF
          sources:
            gmail:
              enabled: true
              owner_auth:
                type: oauth2
                clientId: "${GMAIL_CLIENT_ID}"
                clientSecret: "${GMAIL_CLIENT_SECRET}"
            google_calendar:
              enabled: true
              owner_auth:
                type: oauth2
                clientId: "${CAL_CLIENT_ID}"
                clientSecret: "${CAL_CLIENT_SECRET}"
            github:
              enabled: true
              owner_auth:
                type: github_app
          port: 3000
          EOF

      - name: Build Node.js backend bundle
        working-directory: mobile
        run: npm run bundle:node

      - name: Link iOS native deps hoisted by npm workspaces
        run: node scripts/link-ios-native-deps.cjs

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Build for iOS Simulator
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace PersonalDataHub.xcworkspace \
            -scheme PersonalDataHub \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and smoke-test launch
        working-directory: mobile/ios
        run: |
          set -e
          APP_PATH="build/Build/Products/Debug-iphonesimulator/PersonalDataHub.app"
          BUNDLE_ID="com.personaldatahub"

          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | contains("iPhone"))][0].udid')
          if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "null" ]; then
            echo "::error::No available iPhone simulator found on this runner image."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE_ID"

          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"

          # Give the embedded Node.js backend a moment to start, then confirm the
          # app is still running (not crashed on launch) before screenshotting.
          sleep 8
          if ! xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "::error::App does not appear to be running after launch — crashed on startup?"
            xcrun simctl spawn "$DEVICE_ID" log collect --output /tmp/sim.logarchive || true
            exit 1
          fi

          mkdir -p ../../dist-ios
          xcrun simctl io "$DEVICE_ID" screenshot ../../dist-ios/simulator-screenshot.png

      - name: Zip the simulator .app bundle
        working-directory: mobile/ios
        run: |
          APP_PATH="build/Build/Products/Debug-iphonesimulator/PersonalDataHub.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../../dist-ios/PersonalDataHub-simulator.zip

      - name: Build unsigned for iOS device
        id: device-build
        if: steps.signing-secrets.outputs.enabled != 'true'
        continue-on-error: true
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace PersonalDataHub.xcworkspace \
            -scheme PersonalDataHub \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Zip the unsigned device .app bundle
        if: steps.device-build.outcome == 'success'
        working-directory: mobile/ios
        run: |
          APP_PATH="build-device/Build/Products/Debug-iphoneos/PersonalDataHub.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ../../dist-ios/PersonalDataHub-device-unsigned.zip

      - name: Import signing certificate and provisioning profile
        if: steps.signing-secrets.outputs.enabled == 'true'
        id: import-signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PP_PATH" "$PROFILE_DIR/ci-appstore.mobileprovision"

          PROFILE_UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build, archive and export signed .ipa (App Store)
        if: steps.signing-secrets.outputs.enabled == 'true'
        working-directory: mobile/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.import-signing.outputs.profile_uuid }}
        run: |
          # TestFlight rejects a build whose build number repeats a prior
          # upload, so bump it to something unique every nightly run.
          xcodebuild \
            -workspace PersonalDataHub.xcworkspace \
            -scheme PersonalDataHub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build-device/PersonalDataHub.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.personaldatahub</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build-device/PersonalDataHub.xcarchive \
            -exportPath ../../dist-ios \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload build to TestFlight
        if: steps.signing-secrets.outputs.enabled == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPSTORE_API_KEY_P8_BASE64" | base64 --decode \
            -o ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

          IPA_PATH=$(ls dist-ios/*.ipa | head -n1)
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Clean up signing keychain
        if: always() && steps.signing-secrets.outputs.enabled == 'true'
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: dist-ios/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload simulator app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: dist-ios/PersonalDataHub-simulator.zip
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload unsigned device app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-unsigned-app
          path: dist-ios/PersonalDataHub-device-unsigned.zip
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload signed App Store ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-appstore-signed
          path: dist-ios/*.ipa
          retention-days: 14
          if-no-files-found: ignore

      - name: Update nightly-ios tag
        run: |
          git tag -f nightly-ios
          git push origin nightly-ios --force

      - name: Publish nightly-ios release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=()
          [ -f dist-ios/PersonalDataHub-simulator.zip ] && ASSETS+=(dist-ios/PersonalDataHub-simulator.zip)
          [ -f dist-ios/simulator-screenshot.png ] && ASSETS+=(dist-ios/simulator-screenshot.png)
          [ -f dist-ios/PersonalDataHub-device-unsigned.zip ] && ASSETS+=(dist-ios/PersonalDataHub-device-unsigned.zip)
          for ipa in dist-ios/*.ipa; do [ -f "$ipa" ] && ASSETS+=("$ipa"); done

          gh release delete nightly-ios --yes || true
          gh release create nightly-ios "${ASSETS[@]}" \
            --title "Nightly iOS Build ($(date -u +%Y-%m-%d))" \
            --notes "Automated nightly build. Simulator app is smoke-tested. Signed build (if present) is also uploaded to TestFlight automatically." \
            --prerelease
