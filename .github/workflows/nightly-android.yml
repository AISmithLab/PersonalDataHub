name: Nightly Android Build

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits since last nightly
        id: check
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse refs/tags/nightly 2>/dev/null || git ls-remote origin refs/tags/nightly | cut -f1)
          if [ "$HEAD_SHA" = "$TAG_SHA" ]; then
            echo "No new commits since last nightly build ($HEAD_SHA); skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected ($TAG_SHA -> $HEAD_SHA); building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Write hub-config.yaml from secrets
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          CAL_CLIENT_ID: ${{ secrets.CAL_CLIENT_ID }}
          CAL_CLIENT_SECRET: ${{ secrets.CAL_CLIENT_SECRET }}
        run: |
          cat > hub-config.yaml <<EOF
          sources:
            gmail:
              enabled: true
              owner_auth:
                type: oauth2
                clientId: "${GMAIL_CLIENT_ID}"
                clientSecret: "${GMAIL_CLIENT_SECRET}"
            google_calendar:
              enabled: true
              owner_auth:
                type: oauth2
                clientId: "${CAL_CLIENT_ID}"
                clientSecret: "${CAL_CLIENT_SECRET}"
            github:
              enabled: true
              owner_auth:
                type: github_app
          port: 3000
          EOF

      - name: Build Node.js backend bundle
        working-directory: mobile
        run: npm run bundle:node

      - name: Configure Android SDK path
        working-directory: mobile
        run: npm run setup:android

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Set nightly build metadata
        id: meta
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p dist-android
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
            "dist-android/PersonalDataHub-nightly-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-nightly-apk
          path: dist-android/*.apk
          retention-days: 14

      - name: Delete previous nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes --cleanup-tag || true

      - name: Update nightly release tag
        run: |
          git tag -f nightly
          git push origin nightly --force

      - name: Publish nightly GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly build ${{ steps.meta.outputs.date }} (${{ steps.meta.outputs.sha }})"
          body: |
            Automated nightly Android build from commit ${{ steps.meta.outputs.sha }}.

            This build is **debug-signed** and intended for internal testing only, not distribution via the Play Store.
          prerelease: true
          files: dist-android/*.apk
